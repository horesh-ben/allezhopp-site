# Checks every link on the site (internal pages, organizer websites, pictures) once a week and on demand.
# Runs on GitHub's servers. When links are broken, the run fails and an issue "Broken links" lists them
# (updated each week, closed automatically once everything works again).
# 403 and 429 answers are accepted: some organizer sites refuse automated visitors but work in a browser.
# olympics.com is skipped for the same reason (it breaks the connection of automated visitors).
name: Link check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --accept 200..=299,403,429
            --max-retries 3 --retry-wait-time 5 --timeout 30
            --max-concurrency 8
            --user-agent "Mozilla/5.0 (compatible; AllezHopp link check; +https://allezhopp.ch)"
            --exclude "^https://(www\.)?google\.com/maps"
            --exclude "^https://fonts\.(googleapis|gstatic)\.com"
            --exclude "^https://plausible\.io"
            --exclude "^https://rnwecpchtrzkbrnkdhvt\.supabase\.co"
            --exclude "^https://allezhopp\.ch"
            --exclude "^https://www\.olympics\.com"
            "./**/*.html"
          output: lychee-report.md
          format: markdown
          jobSummary: true
          fail: false
      - name: Open, update or close the "Broken links" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --label broken-links --json number --jq '.[0].number // empty')
          if [ "${{ steps.lychee.outputs.exit_code }}" != "0" ]; then
            gh label create broken-links --color B60205 --description "Found by the weekly link check" --force
            if [ -n "$n" ]; then gh issue edit "$n" --body-file lychee-report.md
            else gh issue create --title "Broken links found by the weekly check" --label broken-links --body-file lychee-report.md; fi
            exit 1
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "All links work again ($(date -u +%F))."
          fi
